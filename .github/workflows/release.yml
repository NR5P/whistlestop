name: Release

# Pushing a version tag (v0.1.0-beta.2, v0.2.0, ...) builds Whistlestop for
# Windows and Linux and publishes one GitHub release with both, each with
# its SHA-256. A tag with a "-" in it (a beta) is marked as a pre-release.
#
#   git tag v0.1.0-beta.2 && git push origin v0.1.0-beta.2
#
# The Mac app is signed with the Developer ID in the Mac's keychain, so it
# is built there and added to the release by hand (docs/BETA.md):
#   VERSION=0.1.0-beta.2 scripts/macos-app.sh
#   gh release upload v0.1.0-beta.2 dist/Whistlestop-0.1.0-beta.2-macos.zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # The C runtime linked in, so the exe runs on a PC without the Visual
      # C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          # All of history and the tags, so build.rs's `git describe` names
          # the tag the app is built from (shown on its Log tab).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin whistlestop
      - name: Package
        shell: pwsh
        run: |
          $name = "whistlestop-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/whistlestop.exe $name/
          Copy-Item .github/release/READ-ME-FIRST.txt $name/
          Copy-Item README.md, LICENSE $name/
          Copy-Item docs/USER-GUIDE.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            whistlestop-${{ github.ref_name }}-windows-x64.zip
            whistlestop-${{ github.ref_name }}-windows-x64.zip.sha256

  linux:
    # Ubuntu 22.04, so it runs on that and newer (glibc 2.35+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries (sound, USB serial, windowing)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin whistlestop
      - name: Package
        run: |
          D="whistlestop-${{ github.ref_name }}-linux-x86_64"
          mkdir "$D"
          cp target/release/whistlestop LICENSE README.md docs/USER-GUIDE.md "$D/"
          tar czf "$D.tar.gz" "$D"
          sha256sum "$D.tar.gz" > "$D.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            whistlestop-${{ github.ref_name }}-linux-x86_64.tar.gz
            whistlestop-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256

  publish:
    # One release, made once both builds are there.
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Whistlestop ${{ github.ref_name }}
          body_path: .github/release/NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
