name: Release (Linux build)

# When a release is published on GitHub, build the Linux app and attach it.
# Ubuntu 22.04, so it runs on that and newer (glibc 2.35+). The Mac app is
# built, signed and attached by hand: scripts/macos-app.sh.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries (sound, USB serial, windowing)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin whistlestop
      - name: Package
        run: |
          V="${TAG#v}"
          D="whistlestop-$V-linux-x86_64"
          mkdir "$D"
          cp target/release/whistlestop LICENSE README.md "$D/"
          cp docs/USER-GUIDE.md "$D/"
          tar czf "$D.tar.gz" "$D"
          echo "ASSET=$D.tar.gz" >> "$GITHUB_ENV"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber
