name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries (sound, USB serial, windowing)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --all-targets
      - name: Test
        # Every test binary runs (--no-fail-fast), and failures become
        # annotations on the run's page, readable without signing in.
        shell: bash
        run: |
          status=0
          cargo test --release --no-fail-fast 2>&1 | tee test-output.txt || status=$?
          if [ "$status" -ne 0 ]; then bash .github/ci/test-failures.sh test-output.txt; fi
          exit "$status"
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: whistlestop-${{ runner.os }}
          path: |
            target/release/whistlestop
            target/release/whistlestop.exe
