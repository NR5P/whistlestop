# The iPhone app. Generate the Xcode project with:  xcodegen
# (after mobile/build-ios.sh has built WhistlestopCore.xcframework).
name: Whistlestop
options:
  bundleIdPrefix: com.nr5p
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Whistlestop:
    type: application
    platform: iOS
    sources: [Whistlestop]
    dependencies:
      - framework: WhistlestopCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nr5p.whistlestop
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Whistlestop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Whistlestop listens to your radio's audio for whistles and data."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Whistlestop reaches your radio bridge, and your home station for remote operation, on your local network."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        OTHER_LDFLAGS: "-lc++ -framework AudioToolbox -framework CoreAudio -framework AVFoundation"
      configFiles: {}
    info:
      path: Whistlestop/Info.plist
      properties:
        UIBackgroundModes: [audio]
  WhistlestopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WhistlestopUITests]
    dependencies:
      - target: Whistlestop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nr5p.whistlestop.uitests
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  Whistlestop:
    build:
      targets:
        Whistlestop: all
        WhistlestopUITests: [test]
    test:
      targets: [WhistlestopUITests]
