[package]
name = "whistlestop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
eframe = "0.37.0"
hex = "0.4.3"
hound = "3.5.1"
num-complex = "0.4.6"
rand = "0.10.3"
rand_distr = "0.6.0"
rfd = "0.18.0"
rtlsdr-nusb = "0.3.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
walkdir = "2.5.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
