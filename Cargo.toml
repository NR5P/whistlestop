[workspace]
members = [".", "mobile/core"]

[package]
name = "whistlestop"
version = "0.1.0"
edition = "2024"

[features]
default = ["desktop"]
# The desktop app (egui window, file dialogs, command line). The phone apps
# build the library without it.
desktop = ["dep:eframe", "dep:rfd", "dep:clap"]

[[bin]]
name = "whistlestop"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1.0.104"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
clap = { version = "4.6.7", features = ["derive"] , optional = true }
cpal = "0.18.2"
dirs = "7.0.0"
eframe = { version = "0.37.0", optional = true }
getrandom = "0.3.4"
hex = "0.4.3"
hkdf = "0.13.0"
hound = "3.5.1"
num-complex = "0.4.6"
rand = "0.10.3"
rand_distr = "0.6.0"
rfd = { version = "0.18.0", optional = true }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
walkdir = "2.5.0"
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
zeroize = "1.9.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

# USB serial ports and the RTL-SDR: desktops only. On a phone the radio's USB
# serial chip is reached through the OS (Android's UsbManager), and CAT can
# use a TCP bridge.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rtlsdr-nusb = "0.3.0"
serialport = "4.10.1"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
